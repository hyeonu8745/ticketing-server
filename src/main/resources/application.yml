server:
  port: 8080
  address: 0.0.0.0
  tomcat:
    # 1. 쓰레드 풀 확장: 동시에 일하는 일꾼을 늘립니다.
    threads:
      max: 400       # 기본값 200에서 2배로 확장
      min-spare: 50  # 항상 대기 중인 일꾼 수
    # 2. 백로그 확장: 소켓 연결 대기열을 늘려 'Socket closed'를 방지합니다.
    accept-count: 1000
    max-connections: 10000 # 동시에 유지할 수 있는 최대 연결 수

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ticketing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    hikari:
      # 3. DB 커넥션 풀 튜닝: DB와 연결된 통로를 미리 확보합니다.
      maximum-pool-size: 50    # 기본값 10에서 50으로 상향 (서버 사양에 따라 조절)
      minimum-idle: 10
      connection-timeout: 5000 # DB 연결을 기다리는 시간 (5초)
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379
      # 4. Redis 커넥션 풀 (Lettuce) 설정 추가
      lettuce:
        pool:
          max-active: 100  # Redis와 통신할 일꾼 수 대폭 확장
          max-idle: 50
          min-idle: 10
          max-wait: 2000ms

  jpa:
    hibernate:
      ddl-auto: update # 테이블 구조 자동 업데이트
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # 비밀키는 256비트(32바이트) 이상이어야 합니다. (아래는 Base64로 인코딩된 임의의 문자열입니다)
  secret: Y29tLXRpY2tldGluZy1zZXJ2ZXItc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9u
  # 토큰 만료 시간 (1시간 = 3600000ms)
  expiration: 3600000

# application.yml
springdoc:
  # Swagger가 에러 처리기를 분석해서 문서에 포함하려는 기능을 끕니다.
  override-with-generic-response: false
  # 현우 님의 컨트롤러 패키지만 스캔하도록 강제합니다.
  packages-to-scan: com.ticketing.server.controller

management:
  metrics:
    tags:
      application: ticketing-server  # 👈 이 줄이 들어가야 그라파나가 인식합니다!
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

  resilience4j:
    circuitbreaker:
      instances:
        ticketingService:
          slidingWindowSize: 10          # 최근 10개의 요청을 감시
          failureRateThreshold: 50       # 에러율이 50%를 넘으면 서킷 오픈!
          waitDurationInOpenState: 10000 # 10초 동안 차단 후 다시 시도
          permittedNumberOfCallsInHalfOpenState: 3

