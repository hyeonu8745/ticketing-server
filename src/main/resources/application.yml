server:
  port: 8080 # (8081 서버라면 8081로 수정)
  address: 0.0.0.0 # 🌟 핵심! 모든 네트워크(WSL 포함)의 요청을 받겠다는 뜻입니다.



spring:
  datasource:
    # Docker로 띄운 MySQL 주소
    url: jdbc:mysql://localhost:3306/ticketing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234 # <--- 설정하신 비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      # Docker로 띄운 Redis 주소
      host: localhost
      port: 6379

  jpa:
    hibernate:
      ddl-auto: update # 테이블 구조 자동 업데이트
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # 비밀키는 256비트(32바이트) 이상이어야 합니다. (아래는 Base64로 인코딩된 임의의 문자열입니다)
  secret: Y29tLXRpY2tldGluZy1zZXJ2ZXItc2VjcmV0LWtleS1mb3Itand0LWF1dGhlbnRpY2F0aW9u
  # 토큰 만료 시간 (1시간 = 3600000ms)
  expiration: 3600000

# application.yml
springdoc:
  # Swagger가 에러 처리기를 분석해서 문서에 포함하려는 기능을 끕니다.
  override-with-generic-response: false
  # 현우 님의 컨트롤러 패키지만 스캔하도록 강제합니다.
  packages-to-scan: com.ticketing.server.controller

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always

  resilience4j:
    circuitbreaker:
      instances:
        ticketingService:
          slidingWindowSize: 10          # 최근 10개의 요청을 감시
          failureRateThreshold: 50       # 에러율이 50%를 넘으면 서킷 오픈!
          waitDurationInOpenState: 10000 # 10초 동안 차단 후 다시 시도
          permittedNumberOfCallsInHalfOpenState: 3