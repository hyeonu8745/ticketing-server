spring:
  application:
    name: ticketing-server

  # 🗄️ MySQL 데이터베이스 연결 지도
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ticketing_db라는 방으로 찾아갑니다.
    url: jdbc:mysql://localhost:3306/ticketing_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    username: root
    password: 1234

  # 🛠️ JPA (자바 객체를 DB 테이블로 자동 변환) 설정
  jpa:
    hibernate:
      ddl-auto: update # 서버가 켜질 때마다 자바 코드에 맞춰 DB 테이블을 자동으로 업데이트합니다.
    show-sql: true # 자바가 DB에 날리는 명령어를 콘솔창에 보여줍니다.
    properties:
      hibernate:
        format_sql: true # 콘솔창의 명령어를 보기 좋게 정렬해 줍니다.

  # 🚀 Redis (인메모리 데이터베이스) 연결 지도
  data:
    redis:
      host: localhost
      port: 6379