services:
  ticketing-mysql:
    image: mysql:8.0
    container_name: ticketing-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=ticketing
    volumes:
      - ./mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1G
    command:
      - --innodb-buffer-pool-size=1G
    restart: always

  ticketing-redis:
    image: redis:alpine
    container_name: ticketing-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis_data:/data
    deploy:
      resources:
        limits:
          memory: 1G
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "800mb", "--maxmemory-policy", "allkeys-lru"]
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always

  # ── Ollama (LLM 모델 서버) ─────────────────────
  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
  # ───────────────────────────────────────────────

volumes:
  ollama_data: