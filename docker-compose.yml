services:
  ticketing-mysql:
    image: mysql:8.0
    container_name: ticketing-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_DATABASE=ticketing
    # [추가] DB 데이터가 실제 하드디스크에 저장되도록 설정
    volumes:
      - ./mysql_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          memory: 1.5G
        reservations:
          memory: 1G
    command:
      - --innodb-buffer-pool-size=1G
    restart: always

  ticketing-redis:
    image: redis:alpine
    container_name: ticketing-redis
    ports:
      - "6379:6379"
    # [추가] 레디스 데이터를 보존하기 위한 볼륨 설정
    volumes:
      - ./redis_data:/data
    deploy:
      resources:
        limits:
          memory: 1G
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "800mb", "--maxmemory-policy", "allkeys-lru"]
    restart: always

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      # [추가] 수집한 메트릭 데이터가 사라지지 않게 보존
      - ./prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: always

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    # [추가] 제작한 대시보드와 설정이 저장되도록 설정
    volumes:
      - ./grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: always